name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm i
      - run: npx eslint .
      - run: xvfb-run -a npm test
      - run: npx @vscode/vsce package
